name: Mirror sync

# Каждый час копирует свежую версию основного сайта thuggervpn.github.io.
on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ThuggerVPN/thuggervpn.github.io
          path: _main
      - name: Copy site
        run: |
          rsync -a --delete \
            --exclude .git --exclude .github --exclude _src --exclude _main \
            --exclude README.md --exclude 'google*.html' --exclude robots.txt --exclude .gitignore --exclude __pycache__ \
            _main/ ./
          rm -rf _main
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Без изменений"; exit 0; fi
          git commit -q -m "Синхронизация с основным сайтом"
          git push -q origin HEAD:main
